<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get PhotoLess</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#EDE8D0" />
  <meta name="apple-itunes-app" content="app-id=6779804822" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="PhotoLess — Keep what matters." />
  <meta property="og:description" content="Review your photos one by one, keep the memories that matter, and clear the rest. Only you ever see your photos." />
  <meta property="og:url" content="https://photolessapp.com/get" />
  <meta property="og:image" content="https://photolessapp.com/assets/PhotoLessLogo_header.webp" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <link rel="apple-touch-icon" href="/assets/icon.png" />

  <!--
    Deliberately standalone: no /lang.js (it would rewrite /get to /<lang>/get,
    which does not exist) and no /styles.css, so the handoff paints instantly
    even on the slow in-app browsers this page exists for.
  -->
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 22px;
      background: #EDE8D0;
      color: #2B1A1F;
      font: 400 17px/1.5 -apple-system, BlinkMacSystemFont, "Hanken Grotesk", "Segoe UI", Roboto, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .card { width: 100%; max-width: 380px; }
    .logo { width: 190px; max-width: 62%; height: auto; margin: 0 auto 26px; display: block; }
    h1 { font-size: 26px; line-height: 1.25; margin: 0 0 10px; font-weight: 600; letter-spacing: -0.01em; }
    p { margin: 0 0 26px; color: #5B4750; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 22px;
      border-radius: 14px;
      background: #6B1F3A;
      color: #FFF8EC;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(107, 31, 58, 0.22);
    }
    .btn svg { width: 19px; height: 19px; flex: 0 0 auto; }
    .alt { display: block; margin-top: 20px; font-size: 15px; color: #7A6570; text-decoration: none; }
    .alt u { text-decoration-color: rgba(122, 101, 112, 0.4); }
    .note { margin: 22px 0 0; font-size: 14px; color: #8A7680; }
    @media (prefers-color-scheme: dark) {
      body { background: #241016; color: #F6EEDF; }
      p { color: #C9B6BE; }
      .note, .alt { color: #A8939C; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/PhotoLessLogo_header.webp" alt="PhotoLess" width="900" height="278" />

    <h1>Keep what matters.</h1>
    <p id="status">Opening the App Store&hellip;</p>

    <a class="btn" id="storeLink" href="https://apps.apple.com/app/id6779804822">
      <svg viewBox="0 0 384 512" aria-hidden="true" focusable="false"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      <span>Download on the App Store</span>
    </a>

    <a class="alt" href="/"><u>Or read more about PhotoLess</u></a>
    <p class="note" id="note" hidden>PhotoLess is on iPhone. Open this page on your phone to install it.</p>
  </main>

  <script>
  (function () {
    'use strict';

    var APP_ID = '6779804822';
    var HTTPS_URL = 'https://apps.apple.com/app/id' + APP_ID;
    var SCHEME_URL = 'itms-apps://apps.apple.com/app/id' + APP_ID;

    var ua = navigator.userAgent || '';
    var isIOS =
      /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS

    if (!isIOS) {
      document.getElementById('status').textContent =
        'Review your photos one by one, keep the memories that matter, and clear the rest.';
      document.getElementById('note').hidden = false;
      return;
    }

    // itms-apps:// hands straight to the App Store app. That matters inside
    // Instagram's and TikTok's in-app browsers, which swallow new windows and
    // often stall on the https listing — the very reason this page exists.
    // Custom schemes can be refused without an error, so fall back to https,
    // but only if we are still the visible page (if the store opened, we are
    // backgrounded and must not navigate underneath it).
    window.location.href = SCHEME_URL;

    setTimeout(function () {
      if (document.visibilityState === 'visible') {
        window.location.href = HTTPS_URL;
      }
    }, 1400);
  })();
  </script>
</body>
</html>
